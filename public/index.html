<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Currency Converter</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Currency Converter</h1>

      <!-- Error banner -->
      <div id="errorBanner" class="error-banner hidden">
        <span id="errorText"></span>
      </div>

      <!-- Main conversion section -->
      <div class="conversion-section">
        <div class="input-group">
          <label for="amount">Amount</label>
          <input
            type="number"
            id="amount"
            placeholder="0.00"
            min="0"
            step="0.01"
            value="1"
            aria-label="Amount to convert"
          >
        </div>

        <div class="input-group">
          <label for="fromCurrency">From</label>
          <select id="fromCurrency" aria-label="Source currency">
            <!-- Populated by JS -->
          </select>
        </div>

        <button id="swapBtn" class="swap-btn" aria-label="Swap currencies" title="Swap currencies">
          ⇄
        </button>

        <div class="input-group">
          <label for="toCurrency">To</label>
          <select id="toCurrency" aria-label="Target currency">
            <!-- Populated by JS -->
          </select>
        </div>
      </div>

      <!-- Result -->
      <div class="result-section">
        <div class="result-display">
          <span id="resultAmount" class="result-amount">0.00</span>
          <span id="resultCurrency" class="result-currency">USD</span>
        </div>
        <div class="rate-info">
          <span id="rateInfo" class="rate-text">Exchange rate unavailable</span>
          <span id="timestamp" class="timestamp">—</span>
        </div>
      </div>

      <!-- Conversion table -->
      <div class="table-section">
        <h3>Converted to all currencies</h3>
        <table id="conversionTable">
          <thead>
            <tr>
              <th>Currency</th>
              <th>Amount</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <!-- Populated by JS -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
